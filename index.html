    <!-- Ignore non-fatal HMR WebSocket connection events in preview iframe -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function FakeHmrSocket() {
            this.readyState = 1; // WebSocket.OPEN
            this.OPEN = 1;
            this.CLOSED = 3;
            this.CONNECTING = 0;
            this.CLOSING = 2;
          }
          FakeHmrSocket.prototype.addEventListener = function(type, listener) {
            if (type === 'open') {
              try { listener({ type: 'open' }); } catch(e) {}
            }
          };
          FakeHmrSocket.prototype.removeEventListener = function() {};
          FakeHmrSocket.prototype.send = function() {};
          FakeHmrSocket.prototype.close = function() {};

          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
              return new FakeHmrSocket();
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return (a && (a.message || a.stack || String(a))) || ''; }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('@vite/client') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message) || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
